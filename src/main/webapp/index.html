<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library Management System</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/formstyle.css">
</head>
<body>
	<div class="page-wrapper">
		<!-- Header -->
		<header class="app-header">
			<div class="logo-badge">
				<svg width="24" height="24" viewBox="0 0 24 24" fill="none"
					stroke="currentColor" stroke-width="2" stroke-linecap="round"
					stroke-linejoin="round">
                    <path
						d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20" />
                </svg>
			</div>
			<div>
				<h1>Library Management System</h1>
				<p>Book Registration &amp; Inventory Catalog Module</p>
			</div>
		</header>

		<!-- Main Card -->
		<main class="card">
			<div class="card-header">
				<h2>Register a New Book</h2>
				<p>Fill in the bibliographic details below to add a title to the
					library catalog.</p>
			</div>

			<form id="bookRegistrationForm" class="book-form" action="RegisterServlet" method="POST">
				<div class="form-grid">

					<!-- 1. Book Id -->
					<div class="form-group">
						<label for="bookId">Book ID <span class="required">*</span></label>
						<input type="number" id="bookId" name="bookId" min="1" max="99999"
							placeholder="e.g., 71001" required>
					</div>

					<!-- 2. Book Title -->
					<div class="form-group">
						<label for="bookTitle">Book Title <span
							class="required">*</span></label> <input type="text" id="bookTitle"
							name="bookTitle" placeholder="e.g., Clean Code" required>
					</div>

					<!-- 3. Author Name -->
					<div class="form-group">
						<label for="authorName">Author Name <span
							class="required">*</span></label> <input type="text" id="authorName"
							name="authorName" placeholder="e.g., Robert C. Martin" required>
					</div>

					<!-- 4. Publisher Name -->
					<div class="form-group">
						<label for="publisherName">Publisher Name <span
							class="required">*</span></label> <input type="text" id="publisherName"
							name="publisherName" placeholder="e.g., Prentice Hall" required>
					</div>

					<!-- 5. Category -->
					<div class="form-group">
						<label for="category">Category <span class="required">*</span></label>
						<select id="category" name="category" required>
							<option value="" disabled selected>Select a category</option>
							<option value="Computer Science">Computer Science</option>
							<option value="Fiction">Fiction</option>
							<option value="Non-Fiction">Non-Fiction</option>
							<option value="Science & Mathematics">Science &amp;
								Mathematics</option>
							<option value="History & Biography">History &amp;
								Biography</option>
							<option value="Business & Economics">Business &amp;
								Economics</option>
							<option value="Literature">Literature</option>
							<option value="Reference">Reference</option>
						</select>
					</div>

					<!-- 6. Edition -->
					<div class="form-group">
						<label for="edition">Edition <span class="required">*</span></label>
						<input type="text" id="edition" name="edition"
							placeholder="e.g., 1st Edition" required>
					</div>

					<!-- 7. Publication Year -->
					<div class="form-group">
						<label for="publicationYear">Publication Year <span
							class="required">*</span></label> <input type="number"
							id="publicationYear" name="publicationYear" min="1500" max="2026"
							placeholder="e.g., 2024" required>
					</div>

					<!-- 8. Price -->
					<div class="form-group">
						<label for="price">Price<span class="required">*</span></label>
						<div class="input-with-prefix">
							<span class="prefix">₹</span> <input type="number" id="price"
								name="price" step="1.00" min="0" placeholder="0.00" required>
						</div>
					</div>

					<!-- 9. Available Quantity -->
					<div class="form-group full-width">
						<label for="availableQuantity">Available Quantity <span
							class="required">*</span></label> <input type="number"
							id="availableQuantity" name="availableQuantity" min="1"
							placeholder="e.g., 15" required>
					</div>

				</div>

				<!-- Form Actions -->
				<div class="form-actions">
					<button type="reset" class="btn btn-secondary">Clear Form</button>
					<button type="submit" class="btn btn-primary">
						<svg width="18" height="18" viewBox="0 0 24 24" fill="none"
							stroke="currentColor" stroke-width="2" stroke-linecap="round"
							stroke-linejoin="round">
                            <path
								d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                            <polyline points="17 21 17 13 7 13 7 21" />
                            <polyline points="7 3 7 8 15 8" />
                        </svg>
						Register Book
					</button>
				</div>
			</form>
		</main>

		<footer class="app-footer">
			<p>&copy; 2026 Library Management System &bull; Book Registration
				Module</p>
		</footer>
	</div>

</body>
</html>
